name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # Skip runs for changes that touch only docs.
    paths-ignore: ['**/*.md', 'LICENSE']

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6

    - name: Install Emacs 31.1 (Linux)
      if: runner.os == 'Linux'
      uses: purcell/setup-emacs@master
      with:
        version: "31.1"

    # purcell/setup-emacs supports only Linux and macOS.  jcs090218/setup-emacs
    # builds the file name emacs-31.1-x86_64.zip, which GNU does not publish
    # (the file is emacs-31.1.zip), so download the GNU zip directly.
    # shortcut: no checksum check, https only; add one if the download source changes.
    - name: Install Emacs 31.1 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'emacs.zip'
        Invoke-WebRequest -Uri 'https://ftp.gnu.org/gnu/emacs/windows/emacs-31/emacs-31.1.zip' -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
        Expand-Archive -Path $zip -DestinationPath 'C:\emacs'
        $bin = (Get-ChildItem 'C:\emacs' -Recurse -Filter emacs.exe | Select-Object -First 1).DirectoryName
        Add-Content -Path $env:GITHUB_PATH -Value $bin

    - name: Show Emacs version
      run: emacs --version

    - name: Check startup
      run: ./test-startup.sh

    - name: Run ERT suites
      run: |
        for f in tests/*.el; do
          [ -e "$f" ] || continue
          echo "== $f"
          emacs -Q --batch -l "$f" -f ert-run-tests-batch-and-exit
        done
