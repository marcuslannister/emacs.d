name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    # Skip runs for changes that touch only docs.
    paths-ignore: ['**/*.md', 'LICENSE']

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6

    # Test the GUI builds that we run. purcell/setup-emacs builds Emacs with
    # --with-x=no --with-ns=no (no window system), and the Base expects a GUI
    # build, so it is not used here.
    - name: Install Emacs 31.1 (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install --cask emacs-app
        EMACS=/Applications/Emacs.app/Contents/MacOS/Emacs
        test -x "$EMACS"
        echo "EMACS=$EMACS" >> "$GITHUB_ENV"

    # jcs090218/setup-emacs builds the file name emacs-31.1-x86_64.zip, which
    # GNU does not publish (the file is emacs-31.1.zip), so download the GNU zip
    # directly.
    # shortcut: no checksum check, https only; add one if the download source changes.
    - name: Install Emacs 31.1 (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'emacs.zip'
        Invoke-WebRequest -Uri 'https://ftp.gnu.org/gnu/emacs/windows/emacs-31/emacs-31.1.zip' -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
        Expand-Archive -Path $zip -DestinationPath 'C:\emacs'
        $bin = (Get-ChildItem 'C:\emacs' -Recurse -Filter emacs.exe | Select-Object -First 1).DirectoryName
        Add-Content -Path $env:GITHUB_PATH -Value $bin

    - name: Show Emacs version
      run: |
        "${EMACS:-emacs}" --version

    - name: Check startup
      run: ./test-startup.sh

    - name: Run ERT suites
      run: |
        for f in tests/*.el; do
          [ -e "$f" ] || continue
          echo "== $f"
          "${EMACS:-emacs}" -Q --batch -l "$f" -f ert-run-tests-batch-and-exit
        done
